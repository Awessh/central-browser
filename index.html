      <div id="app">

        <!-- Barre d'onglets + contrôles de fenêtre (tout-en-un, façon Chrome) -->
        <div id="tabbar">
          <div id="incognito-badge" class="hidden"><i class="fa-solid fa-user-secret"></i> Navigation privée</div>

          <div id="tabs-region">
            <div id="tabs"></div>
            <button id="new-tab-btn" title="Nouvel onglet (Ctrl+T)">+</button>
          </div>

          <div id="window-controls">
            <button id="win-min" class="win-btn" title="Réduire"><i class="fa-solid fa-window-minimize"></i></button>
            <button id="win-max" class="win-btn" title="Agrandir"><i class="fa-regular fa-window-maximize"></i></button>
            <button id="win-close" class="win-btn win-btn-close" title="Fermer"><i class="fa-solid fa-xmark"></i></button>
          </div>
        </div>

        <!-- Barre d'outils : navigation + adresse -->
        <div id="toolbar">
          <button class="tool-btn" id="back-btn" title="Précédent"><i class="fa-solid fa-arrow-left"></i></button>
          <button class="tool-btn" id="forward-btn" title="Suivant"><i class="fa-solid fa-arrow-right"></i></button>
          <button class="tool-btn" id="reload-btn" title="Actualiser (Ctrl+R)"><i class="fa-solid fa-arrow-rotate-right"></i></button>
          <button class="tool-btn" id="home-btn" title="Page d'accueil"><i class="fa-regular fa-house"></i></button>

          <div id="address-bar-container">
            <span id="site-icon"><i class="fa-solid fa-lock"></i></span>
            <input id="address-bar" type="text" placeholder="Rechercher sur Google ou saisir une adresse" autocomplete="off" />
            <button id="star-btn" title="Ajouter aux favoris"><i class="fa-regular fa-star"></i></button>
            <div id="extension-icons"></div>
            <button id="extensions-btn" title="Extensions"><i class="fa-solid fa-puzzle-piece"></i></button>
          </div>

          <!-- Menu flottant des extensions -->
          <div id="extensions-dropdown" class="hidden">
            <div class="ext-dropdown-title">Extensions</div>
            <div id="extensions-dropdown-list"></div>

          </div>

          </div>
          <div id="fnp-dropzone">

            <div id="fnp-empty">
              <i class="fa-regular fa-note-sticky"></i>
